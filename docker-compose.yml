services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TmdbSettings__BaseUrl=https://api.themoviedb.org/3/
      - TmdbSettings__ApiKey=${TMDB_API_KEY:?TMDB_API_KEY is required}
      - Cors__AllowedOrigins__0=http://localhost:5173
      - Cors__AllowedOrigins__1=https://localhost:5173
    ports:
      - "127.0.0.1:5000:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
