version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movieapi-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Jwt__Key=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      - Jwt__Issuer=MovieAPI
      - Jwt__Audience=MovieAPIUsers
      - TmdbSettings__BaseUrl=https://api.themoviedb.org/3/
      - TmdbSettings__ApiKey=${TMDB_API_KEY:?TMDB_API_KEY is required}
      - Cors__AllowedOrigins__0=http://localhost:5173
      - Cors__AllowedOrigins__1=https://localhost:5173
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cinesearch-frontend
    environment:
      - VITE_API_URL=http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - api
