name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore MovieAPI.sln -p:NuGetAuditMode=all '-warnaserror:NU1902;NU1903;NU1904'
      - run: dotnet test MovieAPI.sln --no-restore --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/package.json
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      - run: node --test ../scripts/smoke-production.test.mjs

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      TMDB_API_KEY: '00000000000000000000000000000000'
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Verificar aplicação no Compose
        run: |
          curl -fsS --retry 12 --retry-delay 2 --retry-connrefused --max-time 5 http://127.0.0.1:5000/health | jq -e '.status == "Healthy"'
          curl -fsS --retry 12 --retry-delay 2 --retry-connrefused --max-time 5 http://127.0.0.1:5173/ | grep -F '<div id="root">'
          curl -fsS 'http://127.0.0.1:5173/movie/550?type=movie' | grep -F '<div id="root">'
          status=$(curl -sS -o "$RUNNER_TEMP/catalog-validation.json" -w '%{http_code}' 'http://127.0.0.1:5173/api/movies/discover?page=0')
          test "$status" = 400
          jq -e 'type == "object"' "$RUNNER_TEMP/catalog-validation.json"
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
